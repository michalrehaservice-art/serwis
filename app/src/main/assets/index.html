<style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:#f3f4f6;color:#111}
header{background:#1f3a5f;color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}

nav button.on{border-bottom-color:#1f3a5f;font-weight:700;color:#1f3a5f}
main{padding:10px;max-width:800px;margin:auto}
button{background:#1f3a5f;color:#fff;border:0;border-radius:6px;padding:8px 12px;font-size:14px}

input,select,textarea{width:100%;padding:9px;border:1px solid #ccc;border-radius:6px;font:inherit;background:#fff;color:#111}
textarea{min-height:80px}
.bar{display:flex;gap:8px;margin-bottom:10px}.bar input,.bar select{flex:1}

.Nowe{background:#fde68a}.Wtoku{background:#bfdbfe}.Doust{background:#e9d5ff}.Brakf{background:#fed7aa}.Fakt{background:#fef08a}.Wykonane{background:#bbf7d0}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}.chip{background:#e5e7eb;color:#111;border-radius:16px;padding:7px 12px;white-space:nowrap}.chip.on{background:#1f3a5f;color:#fff}
small,.m{color:#666}h4{margin:12px 0 4px}

</style></head><body>
<div id="busy" hidden>Zapisywanie / wczytywanie…</div>
<header><button id="hb" class="hx" data-act="close" aria-label="Zamknij" hidden>✕</button><b id="ht">Serwis</b><small id="me"></small></header>
<main id="main"></main>
<dialog id="dlg"></dialog><dialog id="dlg2"></dialog>
<script>
// ===== WARSTWA OFFLINE: zastępuje google.script.run lokalną bazą w telefonie + synchronizacją =====
(function(){
const KEYS={Klienci:'klienci',Adresy:'adresy',Urzadzenia:'urzadzenia',Zlecenia:'zlecenia',Kontakty:'kontakty',Rozmowy:'rozmowy',Oczekujace:'oczekujace'};
const DONE=['Wykonane – brak faktury','Wykonane – faktura wystawiona','Wykonane'];
const EMPTY=()=>({me:'',users:[],klienci:[],adresy:[],urzadzenia:[],zlecenia:[],kontakty:[],rozmowy:[],oczekujace:[]});
const cl=x=>JSON.parse(JSON.stringify(x));
const p2=n=>('0'+n).slice(-2),today=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const norm=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,'');
let ST={cfg:null,q:[],D:null,S0:null,last:'',map:{},n:0};
const idb=new Promise((ok,no)=>{const r=indexedDB.open('serwis',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const kvGet=k=>idb.then(db=>new Promise((ok,no)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)}));
const kvSet=(k,v)=>idb.then(db=>new Promise((ok,no)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>ok();t.onerror=()=>no(t.error)}));
const kvDel=k=>idb.then(db=>new Promise(ok=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=()=>ok()}));
const ready=(async()=>{try{const s=await kvGet('state');if(s)ST=Object.assign(ST,s)}catch(e){}})();
let pq=Promise.resolve();const persist=()=>{pq=pq.then(()=>kvSet('state',ST)).catch(()=>{})};
const D_=()=>ST.D||(ST.D=EMPTY());
const rec=(D,sh,id)=>(D[KEYS[sh]]||[]).find(x=>x.id==id);
function setD(d){ST.D=cl(d);ST.S0=cl(d);persist()}
function applyOp(D,op){
 if(op.t=='save'){const L=D[KEYS[op.sheet]],i=L.findIndex(x=>x.id==op.obj.id);if(i>=0)L[i]=Object.assign({},L[i],op.obj);else L.push(cl(op.obj))}
 else if(op.t=='del')cascade(D,op.sheet,op.id)}
function cascade(D,sh,id){const L=D[KEYS[sh]],i=L.findIndex(x=>x.id==id);if(i>=0)L.splice(i,1);
 if(sh=='Klienci'){['urzadzenia','adresy','kontakty'].forEach(k=>D[k]=D[k].filter(x=>x.klientId!=id))}
 if(sh=='Adresy')D.urzadzenia.forEach(u=>{if(u.adresId==id)u.adresId=''})}

// ---------- sieć ----------
const CB={};let seq=0;
window.OFFcb=(id,err,text)=>{const f=CB[id];if(f)f(err,text)};
function net(b){
 if(!ST.cfg)return Promise.reject(new Error('Najpierw skonfiguruj połączenie (ikona ⚙)'));
 const body=JSON.stringify(Object.assign({u:ST.cfg.u,p:ST.cfg.p},b));
 const parse=t=>{try{return JSON.parse(t)}catch(e){throw new Error('Serwer zwrócił nieprawidłową odpowiedź – sprawdź adres skryptu')}};
 return new Promise((ok,no)=>{
  if(window.Android&&Android.post){const id='r'+(++seq);CB[id]=(err,t)=>{delete CB[id];if(err)no(new Error(t));else{try{ok(parse(t))}catch(e){no(e)}}};Android.post(id,ST.cfg.url,body)}
  else fetch(ST.cfg.url,{method:'POST',body:body,headers:{'Content-Type':'text/plain;charset=utf-8'}}).then(r=>r.text()).then(t=>{try{ok(parse(t))}catch(e){no(e)}}).catch(()=>no(new Error('Brak połączenia z internetem')))
 }).then(j=>{if(!j.ok)throw new Error(j.error||'Błąd serwera');return j})}

// ---------- „serwer” lokalny ----------
const needSync=()=>{if(ST.q.length)throw new Error('Najpierw kliknij „Odbierz i wyślij” – masz niewysłane zmiany ('+ST.q.length+')')};
async function fwd(fn,args){await ready;needSync();if(String(args[0]||'').indexOf('tmp_')===0)throw new Error('To zlecenie nie jest jeszcze wysłane na serwer – najpierw „Odbierz i wyślij”');
 const j=await net({a:'call',fn:fn,args:args}),r=j.r;if(r&&r.klienci)setD(r);else if(r&&r.d&&r.d.klienci)setD(r.d);return r}
function qSave(name,o){const D=D_(),base=ST.S0&&rec(ST.S0,name,o.id);
 const ex=ST.q.find(x=>x.t=='save'&&x.sheet==name&&x.obj.id==o.id);
 if(ex)ex.obj=Object.assign({},ex.obj,cl(o));else ST.q.push({t:'save',sheet:name,obj:cl(o),base:base?cl(base):null})}
const API={
 async init(){await ready;const D=cl(D_());D.me=ST.cfg?ST.cfg.u:D.me;return D},
 async save(name,o){await ready;const D=D_();o=cl(o);
  if(name=='Urzadzenia'&&norm(o.nr_seryjny)&&D.urzadzenia.some(u=>u.klientId==o.klientId&&u.id!=o.id&&norm(u.nr_seryjny)==norm(o.nr_seryjny)))throw new Error('Urządzenie o numerze '+o.nr_seryjny+' już istnieje u tego klienta');
  if(!o.id){o.id='tmp_'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);if(name=='Zlecenia'){o.nr='NOWE-'+(++ST.n);o.utworzono=today()}}
  if(name=='Zlecenia'&&DONE.indexOf(o.status)>=0&&!o.data_wykonania)o.data_wykonania=today();
  applyOp(D,{t:'save',sheet:name,obj:o});qSave(name,o);persist();return cl(D)},
 async del(name,id){await ready;const D=D_();
  if(name=='Klienci'&&D.klienci.some(k=>k.rodzic==id))throw new Error('Ten klient ma klientów końcowych – najpierw usuń ich albo przenieś pod innego zleceniodawcę.');
  cascade(D,name,id);ST.q=ST.q.filter(x=>!(x.t=='save'&&x.obj.id==id));if(String(id).indexOf('tmp_')!==0)ST.q.push({t:'del',sheet:name,id:id});persist();return cl(D)},
 async upload(zId,name,mime,b64){await ready;const ref=Date.now().toString(36)+Math.random().toString(36).slice(2,5);await kvSet('b_'+ref,b64);ST.q.push({t:'upload',zId:zId,name:name,mime:mime,ref:ref});persist();return true},
 async protokol(zId,P,sig,mode){await ready;const D=D_(),z=cl(rec(D,'Zlecenia',zId));
  z.data_wykonania=P.data||z.data_wykonania||today();z.pokaz=P.pokaz||'';z.uwagi=P.uwagi||'';z.prot_osoba=P.osoba||'';z.prot_tel=P.telefon||'';z.prot_email=P.email||'';z.prot_urz=P.urzadzenieId||'';
  if(mode=='preview'){if(!ST.q.length&&navigator.onLine!==false&&String(zId).indexOf('tmp_')!==0){try{return await fwd('protokol',[zId,P,null,'preview'])}catch(e){}}return {html:localPreview(z,P)}}
  if(mode=='final'){z.podpisujacy=P.podpisujacy||'';if(DONE.indexOf(z.status)<0)z.status='Wykonane – brak faktury'}
  applyOp(D,{t:'save',sheet:'Zlecenia',obj:z});qSave('Zlecenia',z);
  if(mode=='final')ST.q.push({t:'protokol',zId:zId,P:cl(P),sig:sig});
  persist();return {d:cl(D),local:mode=='final',url:'',id:'',mail:''}}
};
['karta','pliki','wyslij','importUrz','importPdfUrz','zastosujWyniki','akceptujUrz','zapiszPdf'].forEach(fn=>{API[fn]=(...a)=>fwd(fn,a)});

function localPreview(z,P){const D=D_(),k=D.klienci.find(x=>x.id==z.klientId)||{},par=k.rodzic&&D.klienci.find(x=>x.id==k.rodzic),zl=par||k,
 dv=(z.urzadzenia||'').split(',').map(i=>D.urzadzenia.find(u=>u.id==i)).filter(Boolean),e=s=>esc(s),
 L=[['przeglady','Przegląd urządzeń'],['praca','Praca serwisanta'],['czesci','Części'],['dojazd','Dojazd']].filter(a=>(P.pokaz||'').split(',').includes(a[0])).map(a=>{const c=costs(z,a[0]);return c.n>0?'<tr><td>'+a[1]+'</td><td align="right">'+money(c.n)+'</td><td align="right">'+money(c.b)+'</td></tr>':''}).join(''),
 t=costs(z,P.pokaz);
 return '<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>body{font:14px Arial;margin:14px}h3{background:#eef;padding:4px 6px}td,th{border:1px solid #ccc;padding:4px}table{border-collapse:collapse;width:100%}</style></head><body><p style="color:#b45309"><b>Podgląd uproszczony (offline).</b> Pełny PDF powstanie po synchronizacji.</p><h2>PROTOKÓŁ '+e(z.nr)+'</h2>Data wykonania: '+e(z.data_wykonania)+
 '<h3>Zleceniodawca</h3>'+e(zl.nazwa)+'<br>'+e(zl.adres)+'<br>NIP: '+e(zl.nip)+'<h3>Klient / miejsce</h3>'+e(k.nazwa)+'<br>'+e(k.adres)+
 '<h3>Urządzenia</h3>'+(dv.map(u=>e(u.nazwa)+' (S/N '+e(u.nr_seryjny)+')').join('<br>')||'—')+
 '<h3>Kontakt</h3>'+e(P.osoba)+' · '+e(P.telefon)+' · '+e(P.email)+'<h3>Opis usterki</h3>'+e(z.opis_usterki)+'<h3>Wykonane czynności</h3>'+e(z.opis_prac).replace(/\n/g,'<br>')+
 (L?'<h3>Kosztorys</h3><table><tr><th>Pozycja</th><th>Netto</th><th>Brutto</th></tr>'+L+'<tr><td><b>RAZEM</b></td><td align="right"><b>'+money(t.n)+'</b></td><td align="right"><b>'+money(t.b)+'</b></td></tr></table>':'')+
 '<h3>Uwagi</h3>'+e(z.uwagi).replace(/\n/g,'<br>')+'</body></html>'}

// ---------- synchronizacja ----------
async function sync(){await ready;
 if(!ST.cfg)throw new Error('Najpierw skonfiguruj połączenie (ikona ⚙)');
 const rep={sent:0,conflicts:[],errors:[]},todo=ST.q.slice(),keep=[];let p=0;
 try{while(p<todo.length){
  const batch=[],first=todo[p];
  if(first.t=='upload'||first.t=='protokol')batch.push(first);else for(let i=p;i<todo.length&&batch.length<25&&todo[i].t!='upload'&&todo[i].t!='protokol';i++)batch.push(todo[i]);
  const ops=await Promise.all(batch.map(async op=>op.t=='upload'?Object.assign({},op,{b64:await kvGet('b_'+op.ref)}):op));
  const r=await net({a:'push',ops:ops,map:ST.map||{}});
  ST.map=r.map||ST.map;rep.conflicts=rep.conflicts.concat(r.conflicts||[]);
  batch.forEach((op,i)=>{const er=(r.errors||[]).find(x=>x.i==i);if(er){keep.push(Object.assign({},op,{err:er.msg}));rep.errors.push({op:op,msg:er.msg})}else{rep.sent++;if(op.t=='upload')kvDel('b_'+op.ref)}});
  p+=batch.length;ST.q=keep.concat(todo.slice(p));persist()}
 }finally{ST.q=keep.concat(todo.slice(p));persist()}
 const j=await net({a:'pull'});setD(j.d);
 ST.q.forEach(op=>{if(op.t=='save'||op.t=='del')applyOp(ST.D,op)});
 ST.last=new Date().toLocaleString('pl-PL');persist();return rep}

// ---------- interfejs ----------
const OFF=window.OFF={
 async run(){$('#busy').hidden=false;try{const r=await sync();$('#busy').hidden=true;run('init');this.report(r)}catch(e){$('#busy').hidden=true;alert('Synchronizacja nie powiodła się: '+e.message+'\nNiewysłane zmiany zostały zachowane w telefonie.')}},
 report(r){const dlg=$('#dlg');dlg.innerHTML='<h3>Synchronizacja zakończona</h3><p>✔ Wysłano zmian: <b>'+r.sent+'</b><br>✔ Pobrano najnowsze dane z serwera.</p>'+
  (r.conflicts.length?'<h4 style="color:#b45309">⚠ Konflikty ('+r.conflicts.length+')</h4><p class="m">Twoja nowsza zmiana nadpisała serwer. Szczegóły wysłano mailem na service@rehaservice.pl.</p>'+r.conflicts.map(c=>'<div class="card"><div class="d"><b>'+esc(c.label)+'</b>'+(c.note?'<br>'+esc(c.note):'')+c.fields.map(f=>'<br><small>• '+esc(f.f)+': było „'+esc(f.serwer)+'”, jest „'+esc(f.urzadzenie)+'”</small>').join('')+'</div></div>').join(''):'')+
  (r.errors.length?'<h4 style="color:#b91c1c">✖ Nie wysłano ('+r.errors.length+')</h4>'+r.errors.map(x=>'<div class="card"><div class="d">'+esc(x.msg)+'</div></div>').join('')+'<p class="m">Te zmiany zostały w telefonie – możesz je poprawić albo odrzucić na ekranie głównym.</p>':'')+
  '<div class="row"><button id="rp">OK</button></div>';dlg.showModal();$('#rp').onclick=()=>dlg.close()},
 drop(i){if(confirm('Odrzucić tę zmianę?')){const op=ST.q[i];if(op&&op.t=='upload')kvDel('b_'+op.ref);ST.q.splice(i,1);persist();render()}},
 cfgDlg(){const dlg=$('#dlg'),c=ST.cfg||{};
  dlg.innerHTML='<h3>⚙ Konfiguracja</h3><label>Adres skryptu (kończy się na /exec)</label><input id="cf_u" value="'+esc(c.url||'')+'" autocomplete="off" autocapitalize="off"><label>Login (e-mail)</label><input id="cf_l" value="'+esc(c.u||'')+'" autocomplete="off" autocapitalize="off"><label>Hasło</label><input id="cf_p" type="password" value="'+esc(c.p||'')+'">'+
  '<div class="row"><button id="cf_ok">Zaloguj i pobierz dane</button></div><div id="cf_r" class="m"></div>'+(c.u?'<div class="row"><button id="cf_out" class="g">Wyloguj (usuń dane z telefonu)</button></div>':'');
  dlg.showModal();
  $('#cf_ok').onclick=async()=>{const old=ST.cfg,u=$('#cf_u').value.trim(),l=$('#cf_l').value.trim().toLowerCase(),p=$('#cf_p').value;
   if(!/^https:\/\/script\.google\.com\//.test(u)){$('#cf_r').textContent='Adres musi zaczynać się od https://script.google.com/…';return}
   $('#cf_r').textContent='Łączę…';ST.cfg={url:u,u:l,p:p};
   try{const j=await net({a:'login'});
    if(ST.q.length&&old&&old.u!=l){ST.cfg=old;throw new Error('Masz niewysłane zmiany innego użytkownika – najpierw je wyślij')}
    setD(j.d);persist();$('#cf_r').textContent='✔ Zalogowano. Pobrano dane.';run('init');setTimeout(()=>dlg.close(),700)}
   catch(e){ST.cfg=old;$('#cf_r').textContent='✖ '+e.message}};
  if($('#cf_out'))$('#cf_out').onclick=()=>{if(ST.q.length&&!confirm('Masz niewysłane zmiany ('+ST.q.length+'). Wylogowanie je USUNIE. Kontynuować?'))return;ST.cfg=null;ST.D=null;ST.S0=null;ST.q=[];persist();dlg.close();run('init')}}
};

// ===== Poprawianie raportów z miernika: 1 pomiar = 1 strona + uzupełnione pola =====
// deps: {PDFLib, pdfjsLib, textImage(text,sizePt)->Promise<{bytes,w,h}>}
async function analyzeRaport(srcBytes, pdfjsLib) {
  const W = 595.276;
  // 1) analiza: gdzie zaczynają się pomiary i gdzie kończy się treść na stronie
  const pj = await pdfjsLib.getDocument({data: srcBytes.slice(0)}).promise;
  const H = (await pj.getPage(1)).view[3];
  const blocks = []; let cur = null;
  for (let i = 1; i <= pj.numPages; i++) {
    const tc = await (await pj.getPage(i)).getTextContent();
    const items = tc.items.filter(x => x.str.trim());
    const starts = items.filter(x => x.str.trim() === 'PROJEKT:').map(x => H - x.transform[5] - 10.34).filter(y => y > 95 && y < 780).sort((a, b) => a - b);
    const body = items.map(x => H - x.transform[5]).filter(y => y > 102 && y < 780);
    const end = Math.max(...body) + (i === pj.numPages ? 6.5 : 7.0);
    if (!starts.length) { if (cur) cur.segs.push([i - 1, 101.9, end]); continue; }
    if (starts[0] > 104 && cur) cur.segs.push([i - 1, 101.9, starts[0]]);
    // dane urządzenia z tabelki pomiaru (pozycje pól są stałe względem początku tabelki)
    const fld = (s, dy, x0, x1) => items.filter(it => Math.abs(H - it.transform[5] - (s + dy)) < 2.5 && it.transform[4] >= x0 && it.transform[4] < x1)
      .sort((p, q) => p.transform[4] - q.transform[4]).map(x => x.str).join(' ').replace(/\s+/g, ' ').trim();
    starts.forEach((s, k) => { cur = {segs: [[i - 1, s, k + 1 < starts.length ? starts[k + 1] : end]],
      dev: {nazwa: fld(s, 41.0, 96, 192), nr: fld(s, 56.2, 96, 192), due: fld(s, 25.8, 280, 435), tested: fld(s, 10.34, 280, 435)}}; blocks.push(cur); });
  }
  return {H, blocks};
}

// Odczyt urządzeń z raportu: z poprawionego przez aplikację PDF (znacznik w metadanych) albo z oryginalnego pliku miernika
async function readRaportDevices(srcBytes, pdfjsLib) {
  const pj = await pdfjsLib.getDocument({data: srcBytes.slice(0)}).promise;
  try { const m = await pj.getMetadata(), sub = (m.info && m.info.Subject) || '';
    if (sub.indexOf('REHA-DEV:') === 0) return JSON.parse(sub.slice(9)); } catch (e) {}
  const {blocks} = await analyzeRaport(srcBytes, pdfjsLib);
  return blocks.map(b => b.dev);
}

async function fixRaport(srcBytes, V, deps, onStep) {
  const {PDFLib, pdfjsLib} = deps, {PDFDocument, PDFName, PDFArray, PDFRawStream, rgb, StandardFonts} = PDFLib;
  const step = m => onStep && onStep(m);
  const W = 595.276;

  step('Analizuję plik…');
  const {H, blocks} = await analyzeRaport(srcBytes, pdfjsLib);
  if (!blocks.length) throw new Error('Nie znaleziono żadnego pomiaru (brak pola „PROJEKT:”). Czy to na pewno raport z miernika?');

  // 2) kopia źródła bez podpisu/pieczątki, która w oryginale zachodzi na tabelę
  step('Przygotowuję strony…');
  const dec = s => PDFLib.decodePDFRawStream(s).decode();
  const orig = await PDFDocument.load(srcBytes), clean = await PDFDocument.load(srcBytes);
  clean.getPages().forEach(pg => {
    const c = pg.node.Contents(), ctx = clean.context;
    const arr = c instanceof PDFArray ? c.asArray().map(r => ctx.lookup(r)) : [c];
    let s = arr.map(st => { const u = dec(st); let t = ''; for (let k = 0; k < u.length; k++) t += String.fromCharCode(u[k]); return t; }).join('\n');
    const flip = /1 0 0 -1 0 [\d.]+ cm/.test(s), xo = pg.node.Resources().get(PDFName.of('XObject'));
    s = s.replace(/q\s+[-\d.]+\s+0\s+0\s+[-\d.]+\s+[-\d.]+\s+([-\d.]+)\s+cm\s+\/(\S+)\s+Do\s+Q/g, (m, f, name) => {
      const o = xo && xo.get(PDFName.of(name)) && ctx.lookup(xo.get(PDFName.of(name)));
      const isImg = o && o.dict && String(o.dict.get(PDFName.of('Subtype'))) === '/Image';
      const bottom = flip ? parseFloat(f) > 700 : parseFloat(f) < 100;

    pg.node.set(PDFName.of('Contents'), ctx.register(ctx.stream(bytes)));
  });

  // 3) składanie: każda strona = nagłówek + fragmenty jednego pomiaru + stopka
  step('Układam pomiary po jednym na stronie…');
  const out = await PDFDocument.create(), last = orig.getPageCount() - 1;
  const [hdr, ftr] = await out.embedPages([orig.getPage(last), orig.getPage(last)],
    [{left: 0, bottom: H - 101.9, right: W, top: H}, {left: 0, bottom: H - 811.5, right: W, top: H - 700}]);
  const flat = blocks.flatMap(b => b.segs);
  const segEmb = await out.embedPages(flat.map(s => clean.getPage(s[0])),
    flat.map(s => ({left: 0, bottom: H - s[2], right: W, top: H - s[1]})));

  // 4) pola uzupełniane (obrazki z tekstem – dzięki temu działają polskie znaki w każdej przeglądarce)
  step('Wpisuję dane…');
  const font = await out.embedFont(StandardFonts.Helvetica);
  const fields = [
    {k: 'klient', x: 37.8, top: 123.2}, {k: 'komentarz', x: 282.2, top: 138.4},
    {k: 'miejsce', x: 282.2, top: 153.6}, {k: 'uzytkownik', x: 437.1, top: 153.6}];
  const img = {};
  for (const f of fields) if (V[f.k]) { const t = await deps.textImage(V[f.k], 5.7); img[f.k] = {e: await out.embedPng(t.bytes), w: t.w, h: t.h}; }
  if (V.zamowienie) { const t = await deps.textImage(V.zamowienie, 8); img.zam = {e: await out.embedPng(t.bytes), w: t.w, h: t.h}; }

  let si = 0;
  blocks.forEach((b, n) => {
    const page = out.addPage([W, H]);
    page.drawPage(hdr, {x: 0, y: H - 101.9}); page.drawPage(ftr, {x: 0, y: H - 811.5});
    let y = 101.9;
    b.segs.forEach(sg => { const h = sg[2] - sg[1]; page.drawPage(segEmb[si++], {x: 0, y: H - y - h}); y += h; });
    // stara wartość w polu PROJEKT zostaje zamazana kolorem komórki
    page.drawRectangle({x: 36.4, y: H - 132.2, width: 155.4, height: 14.2, color: rgb(.925, .953, 1)});
    for (const f of fields) { const m = img[f.k]; if (m) page.drawImage(m.e, {x: f.x, y: H - f.top - 4.5 - m.h * 0.28 - 0.0, width: m.w, height: m.h}); }
    if (img.zam) page.drawImage(img.zam.e, {x: 356.0, y: H - 50.3 - img.zam.h * 0.28, width: img.zam.w, height: img.zam.h});
    page.drawText((n + 1) + '/' + blocks.length, {x: 474.1, y: H - 819.3, size: 8, font});
  });
  out.setSubject('REHA-DEV:' + JSON.stringify(blocks.map(b => b.dev)));
  step('Zapisuję plik…');
  return {bytes: await out.save(), count: blocks.length, devices: blocks.map(b => b.dev)};
}
